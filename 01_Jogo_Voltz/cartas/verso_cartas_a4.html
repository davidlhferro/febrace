<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTZ: Circuit Break — Verso Oficial do Baralho (Hardware PCB Anti-Cheat)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=JetBrains+Mono:wght@800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #020617;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .no-print-bar {
            background: #0f172a;
            width: 100%;
            max-width: 900px;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid #334155;
        }

        .no-print-bar h1 {
            font-size: 1.15rem;
            font-weight: 900;
            color: #f8fafc;
        }

        .btn-print {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #ffffff;
            font-weight: 900;
            padding: 10px 22px;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 2px 10px rgba(217, 119, 6, 0.4);
            transition: all 0.15s ease;
        }

        .btn-print:hover { background: #f59e0b; }

        /* PÁGINA A4 (210mm x 297mm) */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            padding: 8mm 6mm;
            margin-bottom: 20mm;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            display: grid;
            grid-template-columns: repeat(3, 63mm);
            grid-template-rows: repeat(3, 88mm);
            gap: 2.5mm;
            justify-content: center;
            align-content: center;
            position: relative;
            page-break-after: always;
            break-after: page;
        }

        .page-header-tag {
            position: absolute;
            top: 3mm;
            left: 10mm;
            right: 10mm;
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            color: #64748b;
            border-bottom: 0.5px solid #cbd5e1;
            padding-bottom: 1mm;
        }

        /* VERSO INDIVIDUAL DA CARTA (POKER SIZE: 63mm x 88mm) */
        .card-back {
            width: 63mm;
            height: 88mm;
            background: #070d17;
            border: 1.8px solid #334155;
            border-radius: 4mm;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 3px 8px rgba(0,0,0,0.3);
        }

        .card-back svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body { background: none; padding: 0; margin: 0; }
            .no-print-bar { display: none; }
            .a4-page {
                margin: 0 auto;
                box-shadow: none;
                border: none;
                page-break-after: always;
                break-after: page;
                height: 297mm;
                max-height: 297mm;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <div>
            <h1>🛡️ VOLTZ: Circuit Break — Verso Oficial Anti-Cheat (180° Rotacional)</h1>
            <p>9 Versos por Folha A4 • Geometria Simétrica Anti-Marcação • Padrão Industrial PCB</p>
        </div>
        <button class="btn-print" onclick="window.print()">Imprimir Folha de Versos A4</button>
    </div>

    <!-- PÁGINA A4 COM 9 VERSOS DE CARTAS -->
    <div class="a4-page">
        <div class="page-header-tag">
            <span>VOLTZ: CIRCUIT BREAK // VERSO OFICIAL DO BARALHO (300 DPI)</span>
            <span>FOLHA DE VERSOS (GRADE 3x3 • IMPRIMIR 6 VEZES NO VERSO DAS FOLHAS)</span>
        </div>

        <script>
            function getCardBackSvg() {
                return `
                <svg viewBox="0 0 238 332" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="backCopper" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fde68a"/>
                            <stop offset="25%" stop-color="#f59e0b"/>
                            <stop offset="60%" stop-color="#d97706"/>
                            <stop offset="100%" stop-color="#78350f"/>
                        </linearGradient>

                        <pattern id="backGrid" width="12" height="12" patternUnits="userSpaceOnUse">
                            <line x1="0" y1="0" x2="12" y2="0" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
                            <line x1="0" y1="0" x2="0" y2="12" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
                            <circle cx="6" cy="6" r="0.8" fill="#334155" opacity="0.5"/>
                        </pattern>
                    </defs>

                    <!-- Fundo Substrato FR-4 com Grid Técnico -->
                    <rect width="238" height="332" fill="#070d17"/>
                    <rect width="238" height="332" fill="url(#backGrid)"/>

                    <!-- Moldura Chanfrada Mecânica Dupla -->
                    <rect x="8" y="8" width="222" height="316" rx="4" fill="none" stroke="#334155" stroke-width="1.8"/>
                    <rect x="14" y="14" width="210" height="304" rx="2" fill="none" stroke="#1e293b" stroke-width="1.2"/>

                    <!-- Parafusos Mecânicos nos 4 Cantos -->
                    <circle cx="11" cy="11" r="3.2" fill="#334155" stroke="#070d17" stroke-width="0.8"/>
                    <circle cx="227" cy="11" r="3.2" fill="#334155" stroke="#070d17" stroke-width="0.8"/>
                    <circle cx="11" cy="321" r="3.2" fill="#334155" stroke="#070d17" stroke-width="0.8"/>
                    <circle cx="227" cy="321" r="3.2" fill="#334155" stroke="#070d17" stroke-width="0.8"/>

                    <!-- Geometria Central com Simetria Rotacional Exata de 180° Anti-Cheat -->
                    <g transform="translate(119, 166)">
                        <!-- Anéis de Ressonância Magnética Concêntricos -->
                        <circle cx="0" cy="0" r="76" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="6,4"/>
                        <circle cx="0" cy="0" r="62" fill="none" stroke="#334155" stroke-width="1.8"/>
                        <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="url(#backCopper)" stroke-width="2.8"/>

                        <!-- Padrão Octogonal de Barramento de Potência -->
                        <polygon points="0,-42 30,-30 42,0 30,30 0,42 -30,30 -42,0 -30,-30" fill="#070d17" stroke="url(#backCopper)" stroke-width="2"/>

                        <!-- Trilhas de Circuito em Cruz 45° -->
                        <line x1="-32" y1="-32" x2="32" y2="32" stroke="#f59e0b" stroke-width="2"/>
                        <line x1="32" y1="-32" x2="-32" y2="32" stroke="#f59e0b" stroke-width="2"/>
                        
                        <circle cx="-32" cy="-32" r="3.5" fill="#fde68a" stroke="#070d17" stroke-width="1"/>
                        <circle cx="32" cy="32" r="3.5" fill="#fde68a" stroke="#070d17" stroke-width="1"/>
                        <circle cx="32" cy="-32" r="3.5" fill="#fde68a" stroke="#070d17" stroke-width="1"/>
                        <circle cx="-32" cy="32" r="3.5" fill="#fde68a" stroke="#070d17" stroke-width="1"/>

                        <!-- Emblema Central VOLTZ -->
                        <circle cx="0" cy="0" r="22" fill="#070d17" stroke="#f59e0b" stroke-width="2"/>
                        
                        <!-- Raio Relâmpago Simétrico Central -->
                        <path d="M 0,-14 L 6,-2 L 1,-2 L 8,14 L -6,2 L -1,2 Z" fill="url(#backCopper)" stroke="#ffffff" stroke-width="0.6"/>

                        <!-- Textos Periféricos com Simetria Invertida -->
                        <text x="0" y="-92" font-family="JetBrains Mono" font-weight="900" font-size="7.5" fill="#f59e0b" text-anchor="middle" letter-spacing="3">VOLTZ: CIRCUIT BREAK</text>
                        <text x="0" y="98" font-family="JetBrains Mono" font-weight="900" font-size="7.5" fill="#f59e0b" text-anchor="middle" letter-spacing="3" transform="rotate(180)">VOLTZ: CIRCUIT BREAK</text>
                    </g>
                </svg>
                `;
            }

            for (let i = 0; i < 9; i++) {
                document.write(`<div class="card-back">${getCardBackSvg()}</div>`);
            }
        </script>
    </div>

</body>
</html>
