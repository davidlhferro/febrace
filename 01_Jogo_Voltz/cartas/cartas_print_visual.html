<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTZ: Circuit Break — Edição Bandido (Tiles Contínuos Full-Bleed)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800;900&family=Rubik:wght@800;900&display=swap');

        :root {
            --bg-tile: #1e1b18;
            --wire-copper: #e07a1e;
            --wire-core: #fbb034;
            --wire-border: #0a0908;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #0d0c0b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .no-print-bar {
            background: #1e1b18;
            width: 100%;
            max-width: 920px;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 2px solid #332d27;
        }

        .no-print-bar h1 { font-size: 1.2rem; font-weight: 900; color: #fbb034; }
        .no-print-bar p { font-size: 0.8rem; color: #a89f91; font-family: 'JetBrains Mono', monospace; }

        .btn-print {
            background: #e07a1e; color: #0a0908; font-weight: 900; padding: 10px 22px;
            border: 2px solid #fbb034; border-radius: 8px; cursor: pointer;
        }

        .a4-page {
            width: 210mm; height: 297mm; background: #ffffff;
            padding: 8mm 6mm; margin-bottom: 20mm;
            display: grid; grid-template-columns: repeat(3, 63mm); grid-template-rows: repeat(3, 88mm);
            gap: 2.5mm; justify-content: center; align-content: center; position: relative;
            page-break-after: always; break-after: page;
        }

        .page-header-tag {
            position: absolute; top: 3mm; left: 10mm; right: 10mm;
            display: flex; justify-content: space-between;
            font-family: 'JetBrains Mono', monospace; font-size: 0.52rem; font-weight: 800; color: #64748b;
        }

        .card-bandido {
            width: 63mm; height: 88mm; background: var(--bg-tile);
            border-radius: 3mm; position: relative; overflow: hidden;
            box-sizing: border-box; border: 1.5px solid #000000;
        }
        .card-bandido svg { width: 100%; height: 100%; display: block; }

        @page { size: A4 portrait; margin: 0; }
        @media print {
            body { background: none; padding: 0; margin: 0; }
            .no-print-bar { display: none; }
            .a4-page { margin: 0 auto; box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <div>
            <h1>🎴 VOLTZ: Circuit Break — Edição PnP Completa (72 Cartas)</h1>
            <p>Deck Oficial 2.0 • 8 Páginas A4 • Impressão Borda-a-Borda</p>
        </div>
        <button class="btn-print" onclick="window.print()">Imprimir Baralho</button>
    </div>

    <svg style="position: absolute; width: 0; height: 0;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="pipeGradientHoriz" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fbb034"/><stop offset="35%" stop-color="#e07a1e"/>
                <stop offset="85%" stop-color="#b25509"/><stop offset="100%" stop-color="#5a2702"/>
            </linearGradient>
            <linearGradient id="pipeGradientVert" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#fbb034"/><stop offset="35%" stop-color="#e07a1e"/>
                <stop offset="85%" stop-color="#b25509"/><stop offset="100%" stop-color="#5a2702"/>
            </linearGradient>
            <pattern id="bandidoGround" width="20" height="20" patternUnits="userSpaceOnUse">
                <rect width="20" height="20" fill="#1e1b18"/>
                <circle cx="3" cy="5" r="0.8" fill="#2d2924"/><circle cx="14" cy="12" r="1.1" fill="#12100e"/>
                <circle cx="9" cy="17" r="0.7" fill="#2d2924"/><circle cx="18" cy="4" r="0.9" fill="#12100e"/>
            </pattern>
        </defs>
    </svg>

    <div id="pages-container"></div>

    <script>
        const DECK_COMPOSITION = [
            { id: 'gen_12v', count: 1 },
            { id: 'res_1ohm_straight', count: 6 }, { id: 'res_1ohm_corner', count: 4 },
            { id: 'res_2ohm_straight', count: 6 }, { id: 'res_2ohm_corner', count: 4 },
            { id: 'res_3ohm_straight', count: 5 }, { id: 'res_3ohm_corner', count: 3 },
            { id: 'wire_straight', count: 4 }, { id: 'wire_corner', count: 4 },
            { id: 'wire_t', count: 4 }, { id: 'wire_cross', count: 2 },
            { id: 'load_led_3v', count: 3 }, { id: 'load_servidor_4v', count: 3 },
            { id: 'load_sirene_6v', count: 2 }, { id: 'load_bomba_6v', count: 2 }, { id: 'load_tomografo_12v', count: 2 },
            { id: 'fuse_1a', count: 3 }, { id: 'gnd_cable', count: 14 }
        ]; // Total 72 cards

        function getBaseBackground() {
            return `
            <rect width="238" height="332" fill="url(#bandidoGround)"/>
            <path d="M 15 30 Q 35 45 45 40" stroke="#12100e" stroke-width="1.5" fill="none"/>
            <path d="M 200 280 Q 215 295 225 290" stroke="#12100e" stroke-width="1.5" fill="none"/>
            <path d="M 210 50 Q 195 70 205 90" stroke="#12100e" stroke-width="1.5" fill="none"/>
            <path d="M 25 300 Q 40 310 35 325" stroke="#12100e" stroke-width="1.5" fill="none"/>
            `;
        }

        function getTubes(shape) {
            let svg = '';
            if (['STRAIGHT', 'T_JUNCTION', 'CROSS_4WAY', 'DEAD_END'].includes(shape)) {
                svg += `<rect x="0" y="142" width="119" height="48" fill="url(#pipeGradientHoriz)" stroke="#0a0908" stroke-width="5"/>`;
            }
            if (['STRAIGHT', 'T_JUNCTION', 'CROSS_4WAY'].includes(shape)) {
                svg += `<rect x="119" y="142" width="119" height="48" fill="url(#pipeGradientHoriz)" stroke="#0a0908" stroke-width="5"/>`;
            }
            if (['CORNER_90', 'T_JUNCTION', 'CROSS_4WAY'].includes(shape)) {
                svg += `<rect x="95" y="166" width="48" height="166" fill="url(#pipeGradientVert)" stroke="#0a0908" stroke-width="5"/>`;
            }
            if (['CORNER_90'].includes(shape)) { // Corner goes Left to Bottom
                svg += `<rect x="0" y="142" width="119" height="48" fill="url(#pipeGradientHoriz)" stroke="#0a0908" stroke-width="5"/>`;
            }
            if (['CROSS_4WAY', 'GENERATOR'].includes(shape)) {
                svg += `<rect x="95" y="0" width="48" height="166" fill="url(#pipeGradientVert)" stroke="#0a0908" stroke-width="5"/>`;
            }
            if (shape !== 'STRAIGHT') {
                svg += `<circle cx="119" cy="166" r="23" fill="#e07a1e" stroke="#0a0908" stroke-width="5"/>`;
            }
            return svg;
        }

        function getGenBandido() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}
                <rect x="95" y="0" width="48" height="166" fill="url(#pipeGradientVert)" stroke="#0a0908" stroke-width="5"/>
                <rect x="95" y="166" width="48" height="166" fill="url(#pipeGradientVert)" stroke="#0a0908" stroke-width="5"/>
                <rect x="0" y="142" width="119" height="48" fill="url(#pipeGradientHoriz)" stroke="#0a0908" stroke-width="5"/>
                <rect x="119" y="142" width="119" height="48" fill="url(#pipeGradientHoriz)" stroke="#0a0908" stroke-width="5"/>
                <circle cx="119" cy="166" r="62" fill="#0a0908"/>
                <circle cx="119" cy="166" r="56" fill="#e07a1e" stroke="#fbb034" stroke-width="4"/>
                <circle cx="119" cy="166" r="44" fill="#1e1b18" stroke="#0a0908" stroke-width="4"/>
                <polygon points="119,130 102,168 116,168 110,202 136,158 122,158" fill="#fbb034" stroke="#0a0908" stroke-width="2.5"/>
                <rect x="74" y="236" width="90" height="22" rx="4" fill="#0a0908"/>
                <text x="119" y="252" font-family="Rubik" font-weight="900" font-size="12" fill="#fbb034" text-anchor="middle">GERADOR 12V</text>
            </svg>`;
        }

        function getResistor(rVal, ringColor, shape) {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}
                ${getTubes(shape)}
                <rect x="64" y="122" width="110" height="88" rx="20" fill="#f5eedc" stroke="#0a0908" stroke-width="6"/>
                <rect x="82" y="122" width="14" height="88" fill="${ringColor}" stroke="#0a0908" stroke-width="2"/>
                <rect x="106" y="122" width="14" height="88" fill="#0a0908"/>
                <rect x="130" y="122" width="14" height="88" fill="#e07a1e" stroke="#0a0908" stroke-width="2"/>
                <circle cx="119" cy="74" r="32" fill="#0a0908"/><circle cx="119" cy="74" r="28" fill="${ringColor}"/>
                <text x="119" y="84" font-family="Rubik" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">${rVal}Ω</text>
                <rect x="64" y="240" width="110" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="257" font-family="Rubik" font-weight="900" font-size="11" fill="#f5eedc" text-anchor="middle">RESISTOR ${rVal}Ω</text>
            </svg>`;
        }

        function getWire(shape, name) {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}
                ${getTubes(shape)}
                <rect x="64" y="246" width="110" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="263" font-family="Rubik" font-weight="900" font-size="11" fill="#fbb034" text-anchor="middle">${name}</text>
            </svg>`;
        }

        function getLed() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}${getTubes('STRAIGHT')}
                <circle cx="119" cy="166" r="64" fill="#0a0908"/><circle cx="119" cy="166" r="56" fill="#fde047" stroke="#ca8a04" stroke-width="4"/>
                <circle cx="119" cy="166" r="42" fill="#ffffff"/>
                <path d="M 104 186 L 112 150 L 126 150 L 134 186" fill="none" stroke="#ca8a04" stroke-width="6"/>
                <rect x="69" y="246" width="100" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="263" font-family="Rubik" font-weight="900" font-size="12" fill="#fde047" text-anchor="middle">LED 3V // 1Ω</text>
            </svg>`;
        }

        function getServer() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}${getTubes('STRAIGHT')}
                <rect x="54" y="106" width="130" height="120" rx="8" fill="#0a0908"/>
                <rect x="60" y="112" width="118" height="108" rx="6" fill="#1e293b" stroke="#0a0908" stroke-width="3"/>
                <rect x="54" y="248" width="130" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="265" font-family="Rubik" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle">SERVIDOR 4V // 1Ω</text>
            </svg>`;
        }

        function getSirene() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}${getTubes('STRAIGHT')}
                <rect x="80" y="192" width="78" height="24" rx="5" fill="#0a0908"/>
                <path d="M 86 192 C 86 110 152 110 152 192 Z" fill="#0a0908"/>
                <path d="M 90 192 C 90 118 148 118 148 192 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
                <circle cx="119" cy="162" r="14" fill="#ffffff" opacity="0.9"/>
                <rect x="54" y="254" width="130" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="271" font-family="Rubik" font-weight="900" font-size="12" fill="#fca5a5" text-anchor="middle">SIRENE 6V // 1Ω</text>
            </svg>`;
        }

        function getMotor() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}${getTubes('STRAIGHT')}
                <circle cx="120" cy="166" r="48" fill="#0369a1" stroke="#0a0908" stroke-width="4"/>
                <circle cx="120" cy="166" r="42" fill="#0284c7"/>
                <rect x="54" y="254" width="130" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="271" font-family="Rubik" font-weight="900" font-size="12" fill="#bae6fd" text-anchor="middle">BOMBA 6V // 2Ω</text>
            </svg>`;
        }

        function getTomografo() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}${getTubes('STRAIGHT')}
                <circle cx="119" cy="166" r="66" fill="#0a0908"/>
                <circle cx="119" cy="166" r="58" fill="#dc2626" stroke="#ffffff" stroke-width="4"/>
                <circle cx="119" cy="166" r="38" fill="#0a0908"/><circle cx="119" cy="166" r="20" fill="#ffffff"/>
                <rect x="44" y="246" width="150" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="263" font-family="Rubik" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">TOMÓGRAFO 12V // 4Ω</text>
            </svg>`;
        }

        function getGnd() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}
                <rect x="0" y="142" width="130" height="48" fill="url(#pipeGradientHoriz)" stroke="#0a0908" stroke-width="5"/>
                <rect x="115" y="90" width="108" height="152" rx="14" fill="#0a0908"/>
                <rect x="121" y="96" width="96" height="140" rx="10" fill="#0d9488" stroke="#14b8a6" stroke-width="4"/>
                <line x1="121" y1="166" x2="155" y2="166" stroke="#0a0908" stroke-width="10"/>
                <line x1="155" y1="120" x2="155" y2="212" stroke="#0a0908" stroke-width="12"/>
                <rect x="84" y="254" width="140" height="24" rx="4" fill="#0a0908"/>
                <text x="154" y="271" font-family="Rubik" font-weight="900" font-size="12" fill="#2dd4bf" text-anchor="middle">CABO TERRA (0V)</text>
            </svg>`;
        }

        function getFuse() {
            return `<svg viewBox="0 0 238 332">${getBaseBackground()}${getTubes('STRAIGHT')}
                <rect x="45" y="118" width="148" height="96" rx="22" fill="#0a0908"/>
                <rect x="51" y="124" width="136" height="84" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
                <path d="M 81 166 Q 105 132 119 166 T 157 166" fill="none" stroke="#dc2626" stroke-width="6"/>
                <rect x="54" y="246" width="130" height="24" rx="4" fill="#0a0908"/>
                <text x="119" y="263" font-family="Rubik" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle">FUSÍVEL 1A</text>
            </svg>`;
        }

        function generateCardSvg(id) {
            if (id === 'gen_12v') return getGenBandido();
            if (id === 'res_1ohm_straight') return getResistor(1, '#2e7d32', 'STRAIGHT');
            if (id === 'res_1ohm_corner') return getResistor(1, '#2e7d32', 'CORNER_90');
            if (id === 'res_2ohm_straight') return getResistor(2, '#1565c0', 'STRAIGHT');
            if (id === 'res_2ohm_corner') return getResistor(2, '#1565c0', 'CORNER_90');
            if (id === 'res_3ohm_straight') return getResistor(3, '#ea580c', 'STRAIGHT');
            if (id === 'res_3ohm_corner') return getResistor(3, '#ea580c', 'CORNER_90');
            if (id === 'wire_straight') return getWire('STRAIGHT', 'TRILHA RETA');
            if (id === 'wire_corner') return getWire('CORNER_90', 'CURVA 90°');
            if (id === 'wire_t') return getWire('T_JUNCTION', 'CONECTOR T');
            if (id === 'wire_cross') return getWire('CROSS_4WAY', 'CRUZAMENTO 4X');
            if (id === 'load_led_3v') return getLed();
            if (id === 'load_servidor_4v') return getServer();
            if (id === 'load_sirene_6v') return getSirene();
            if (id === 'load_bomba_6v') return getMotor();
            if (id === 'load_tomografo_12v') return getTomografo();
            if (id === 'fuse_1a') return getFuse();
            if (id === 'gnd_cable') return getGnd();
            return '';
        }

        const cardsFlat = [];
        DECK_COMPOSITION.forEach(c => {
            for(let i=0; i<c.count; i++) cardsFlat.push(c.id);
        });

        const container = document.getElementById('pages-container');
        for (let i = 0; i < cardsFlat.length; i += 9) {
            const pageCards = cardsFlat.slice(i, i + 9);
            let pageHtml = `<div class="a4-page">
                <div class="page-header-tag">
                    <span>VOLTZ: CIRCUIT BREAK // EDIÇÃO PNP COMPLETA</span>
                    <span>PÁGINA ${Math.floor(i/9) + 1} / 8</span>
                </div>`;
            pageCards.forEach(cardId => {
                pageHtml += `<div class="card-bandido">${generateCardSvg(cardId)}</div>`;
            });
            pageHtml += `</div>`;
            container.innerHTML += pageHtml;
        }
    </script>
</body>
</html>
