<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTZ — Print and Play (Estilo Digital / Playtest)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800;900&family=Rubik:wght@800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #334155;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            padding: 20px;
        }

        .no-print-bar {
            background: #1e293b; width: 100%; max-width: 900px; padding: 16px 24px;
            border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 2px solid #475569;
        }

        .no-print-bar h1 { font-size: 1.2rem; font-weight: 900; color: #38bdf8; }
        .no-print-bar p { font-size: 0.8rem; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }

        .btn-print {
            background: #38bdf8; color: #0f172a; font-weight: 900; padding: 10px 22px;
            border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        }

        .a4-page {
            width: 210mm; height: 297mm; /* A4 Retrato */
            background: #ffffff;
            padding: 27.5mm 17.5mm; /* Margens para centralizar 175x235 no 210x297 */
            margin-bottom: 20px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 55mm);
            grid-template-rows: repeat(4, 55mm);
            gap: 5mm; /* Espaço para recorte */
            page-break-after: always;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-container {
            width: 55mm;
            height: 55mm;
            position: relative;
            border: 1px solid #94a3b8; /* Borda de corte definida */
            border-radius: 4px; /* Cantos arredondados na linha de corte */
            overflow: hidden;
        }

        .card-container svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85); /* Reduz a escala interna para caber no 55mm */
            transform-origin: center;
        }

        .page-header-tag {
            position: absolute; top: 10mm; left: 15mm; right: 15mm;
            display: flex; justify-content: space-between;
            font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #94a3b8;
            font-weight: 900;
        }

        @page { size: A4 portrait; margin: 0; }
        @media print {
            body { background: none; padding: 0; margin: 0; }
            .no-print-bar { display: none; }
            .a4-page { margin: 0; box-shadow: none; border: none; }
            .card-container { border: 1px solid #cbd5e1; }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <div>
            <h1>🖨️ VOLTZ — Print and Play (Formato Quadrado Tático)</h1>
            <p>Layout configurado para 12 cartas (55x55mm) por página A4, com espaçamento de 5mm para recorte seguro.</p>
        </div>
        <button class="btn-print" onclick="window.print()">Imprimir PDF (A4 Retrato)</button>
    </div>

    <div id="pages-container"></div>

    <script>
        const TOPOLOGY_SHAPES = {
            STRAIGHT: { top: false, right: true, bottom: false, left: true },
            CORNER_90: { top: false, right: false, bottom: true, left: true },
            T_JUNCTION: { top: false, right: true, bottom: true, left: true },
            CROSS_4WAY: { top: true, right: true, bottom: true, left: true },
            DEAD_END: { top: false, right: false, bottom: false, left: true },
            GENERATOR: { top: true, right: true, bottom: true, left: true }
        };

        const CARDS_CATALOG = [
            { id: 'gen_12v', type: 'generator', name: 'Gerador 12V', shape: 'GENERATOR', basePorts: TOPOLOGY_SHAPES.GENERATOR, voltageIn: 12, r: 0, count: 1 },
            { id: 'res_1ohm_straight', type: 'resistor', name: 'Resistor 1Ω (Reta)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, r: 1, count: 6 },
            { id: 'res_1ohm_corner', type: 'resistor', name: 'Resistor 1Ω (Curva)', shape: 'CORNER_90', basePorts: TOPOLOGY_SHAPES.CORNER_90, r: 1, count: 4 },
            { id: 'res_2ohm_straight', type: 'resistor', name: 'Resistor 2Ω (Reta)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, r: 2, count: 6 },
            { id: 'res_2ohm_corner', type: 'resistor', name: 'Resistor 2Ω (Curva)', shape: 'CORNER_90', basePorts: TOPOLOGY_SHAPES.CORNER_90, r: 2, count: 4 },
            { id: 'res_3ohm_straight', type: 'resistor', name: 'Resistor 3Ω (Reta)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, r: 3, count: 5 },
            { id: 'res_3ohm_corner', type: 'resistor', name: 'Resistor 3Ω (Curva)', shape: 'CORNER_90', basePorts: TOPOLOGY_SHAPES.CORNER_90, r: 3, count: 3 },
            { id: 'wire_straight', type: 'wire', name: 'Trilha Condutora (Reta)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, r: 0, count: 7 },
            { id: 'wire_corner', type: 'wire', name: 'Curva 90°', shape: 'CORNER_90', basePorts: TOPOLOGY_SHAPES.CORNER_90, r: 0, count: 7 },
            { id: 'wire_t', type: 'wire', name: 'Conector T (3 Saídas)', shape: 'T_JUNCTION', basePorts: TOPOLOGY_SHAPES.T_JUNCTION, r: 0, count: 4 },
            { id: 'wire_cross', type: 'wire', name: 'Cruzamento (4 Saídas)', shape: 'CROSS_4WAY', basePorts: TOPOLOGY_SHAPES.CROSS_4WAY, r: 0, count: 2 },
            { id: 'load_led_3v', type: 'equipment', name: 'LED Piloto (3V // 1Ω)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, vNom: 3, r: 1, count: 3 },
            { id: 'load_servidor_4v', type: 'equipment', name: 'Servidor Central (4V // 1Ω)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, vNom: 4, r: 1, count: 3 },
            { id: 'load_sirene_6v', type: 'equipment', name: 'Sirene de Alarme (6V // 1Ω)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, vNom: 6, r: 1, count: 2 },
            { id: 'load_bomba_6v', type: 'equipment', name: 'Bomba Centrífuga (6V // 2Ω)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, vNom: 6, r: 2, count: 2 },
            { id: 'load_tomografo_12v', type: 'equipment', name: 'Tomógrafo UTI (12V // 4Ω)', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, vNom: 12, r: 4, count: 2 },
            { id: 'gnd_cable', type: 'gnd', name: 'Cabo Terra (GND 0V)', shape: 'DEAD_END', basePorts: TOPOLOGY_SHAPES.DEAD_END, r: 0, count: 8 },
            { id: 'fuse_1a', type: 'fuse', name: 'Fusível 1A', shape: 'STRAIGHT', basePorts: TOPOLOGY_SHAPES.STRAIGHT, iMax: 1.0, r: 0, count: 3 }
        ];

        function generateFullDeck() {
            const deck = [];
            let counter = 1;
            CARDS_CATALOG.forEach(def => {
                for (let i = 0; i < def.count; i++) {
                    deck.push({
                        ...def,
                        uid: `card_${def.id}_${counter++}`,
                        rotation: 0
                    });
                }
            });
            // Ordenar por tipo para a impressão ficar organizada
            deck.sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
            return deck;
        }

        function renderCardSVG(card) {
            const w = "65mm";
            const h = "65mm";
            
            const pipeCore = card.isBurned ? '#475569' : '#e07a1e';
            const pipeStroke = '#0a0908';
            
            const baseVisual = `
                <rect width="100" height="100" fill="#1e1b18"/>
                <circle cx="10" cy="15" r="1.5" fill="#2d2924"/><circle cx="90" cy="85" r="2" fill="#12100e"/>
                <circle cx="80" cy="10" r="1" fill="#2d2924"/><circle cx="20" cy="90" r="1.5" fill="#12100e"/>
            `;

            function getTubes(shape) {
                let bgPaths = '';
                let fgPaths = '';

                const addLine = (x1, y1, x2, y2) => {
                    const path = `M ${x1} ${y1} L ${x2} ${y2}`;
                    bgPaths += `<path d="${path}" fill="none" stroke="${pipeStroke}" stroke-width="24" stroke-linecap="butt"/>`;
                    fgPaths += `<path d="${path}" fill="none" stroke="${pipeCore}" stroke-width="18" stroke-linecap="butt"/>`;
                };

                const addCurve = (x1, y1, cx, cy, x2, y2) => {
                    const path = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
                    bgPaths += `<path d="${path}" fill="none" stroke="${pipeStroke}" stroke-width="24" stroke-linecap="butt"/>`;
                    fgPaths += `<path d="${path}" fill="none" stroke="${pipeCore}" stroke-width="18" stroke-linecap="butt"/>`;
                };

                const addCenterJoint = () => {
                    bgPaths += `<circle cx="50" cy="50" r="12" fill="${pipeStroke}"/>`;
                    fgPaths += `<circle cx="50" cy="50" r="9" fill="${pipeCore}"/>`;
                };

                if (shape === 'STRAIGHT') {
                    addLine(0, 50, 100, 50);
                } else if (shape === 'CORNER_90') {
                    addCurve(0, 50, 50, 50, 50, 100);
                } else if (shape === 'T_JUNCTION') {
                    addLine(0, 50, 100, 50);
                    addLine(50, 50, 50, 100);
                    addCenterJoint();
                } else if (shape === 'CROSS_4WAY') {
                    addLine(0, 50, 100, 50);
                    addLine(50, 0, 50, 100);
                    addCenterJoint();
                } else if (shape === 'DEAD_END') {
                    addLine(0, 50, 50, 50);
                    addCenterJoint();
                } else if (shape === 'GENERATOR') {
                    addLine(0, 50, 100, 50);
                    addLine(50, 0, 50, 100);
                    addCenterJoint();
                }

                return bgPaths + fgPaths;
            }

            let bodyVisual = '';

            if (card.id === 'gen_12v') {
                bodyVisual = getTubes('GENERATOR') + `
                    <circle cx="50" cy="50" r="26" fill="#0a0908"/>
                    <circle cx="50" cy="50" r="22" fill="#e07a1e" stroke="#fbb034" stroke-width="2"/>
                    <circle cx="50" cy="50" r="14" fill="#1e1b18" stroke="#0a0908" stroke-width="2"/>
                    <polygon points="50,38 43,51 49,51 46,62 57,47 51,47" fill="#fbb034" stroke="#0a0908" stroke-width="1.5"/>
                    <rect x="25" y="76" width="50" height="12" rx="2" fill="#0a0908"/>
                    <text x="50" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="#fbb034" text-anchor="middle">GERADOR 12V</text>
                `;
            } else if (card.type === 'resistor') {
                const rColor = card.r === 1 ? '#2e7d32' : (card.r === 2 ? '#1565c0' : '#ea580c');
                let resBody = '';
                if (card.shape === 'CORNER_90') {
                    resBody = `
                        <g transform="translate(37.5, 62.5) rotate(45)">
                            <rect x="-18" y="-12" width="36" height="24" rx="6" fill="#f5eedc" stroke="#0a0908" stroke-width="2"/>
                            <rect x="-10" y="-12" width="4" height="24" fill="${rColor}" stroke="#0a0908" stroke-width="1"/>
                            <rect x="-2" y="-12" width="4" height="24" fill="#0a0908"/>
                            <rect x="6" y="-12" width="4" height="24" fill="#e07a1e" stroke="#0a0908" stroke-width="1"/>
                        </g>
                    `;
                } else {
                    resBody = `
                        <g transform="translate(50, 50)">
                            <rect x="-24" y="-16" width="48" height="32" rx="8" fill="#f5eedc" stroke="#0a0908" stroke-width="2"/>
                            <rect x="-14" y="-16" width="5" height="32" fill="${rColor}" stroke="#0a0908" stroke-width="1"/>
                            <rect x="-4" y="-16" width="5" height="32" fill="#0a0908"/>
                            <rect x="6" y="-16" width="5" height="32" fill="#e07a1e" stroke="#0a0908" stroke-width="1"/>
                        </g>
                    `;
                }
                
                bodyVisual = getTubes(card.shape) + resBody + `
                    <circle cx="50" cy="14" r="10" fill="#0a0908"/><circle cx="50" cy="14" r="8" fill="${rColor}"/>
                    <text x="50" y="17" font-family="'Rubik', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">${card.r}Ω</text>
                `;
            } else if (card.type === 'equipment') {
                const screenColor = card.isBurned ? '#ef4444' : '#fde047';
                if (card.id.includes('led')) {
                    bodyVisual = getTubes('STRAIGHT') + `
                        <circle cx="50" cy="50" r="22" fill="#0a0908"/>
                        <circle cx="50" cy="50" r="18" fill="${screenColor}" stroke="#ca8a04" stroke-width="2"/>
                        <circle cx="50" cy="50" r="12" fill="#ffffff"/>
                        <rect x="25" y="76" width="50" height="12" rx="2" fill="#0a0908"/>
                        <text x="50" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="${screenColor}" text-anchor="middle">LED 3V</text>
                    `;
                } else if (card.id.includes('servidor')) {
                    const svrColor = card.isBurned ? '#ef4444' : '#38bdf8';
                    bodyVisual = getTubes('STRAIGHT') + `
                        <rect x="25" y="25" width="50" height="40" rx="4" fill="#0a0908"/>
                        <rect x="30" y="30" width="40" height="30" rx="3" fill="#1e293b" stroke="#0a0908" stroke-width="2"/>
                        <circle cx="38" cy="38" r="2" fill="${svrColor}"/>
                        <rect x="25" y="76" width="50" height="12" rx="2" fill="#0a0908"/>
                        <text x="50" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="${svrColor}" text-anchor="middle">SERVER 4V</text>
                    `;
                } else if (card.id.includes('sirene')) {
                    const sirColor = card.isBurned ? '#7f1d1d' : '#dc2626';
                    bodyVisual = getTubes('STRAIGHT') + `
                        <rect x="35" y="58" width="30" height="8" rx="2" fill="#0a0908"/>
                        <path d="M 39 58 C 39 28 61 28 61 58 Z" fill="#0a0908"/>
                        <path d="M 43 58 C 43 34 57 34 57 58 Z" fill="${sirColor}" stroke="#991b1b" stroke-width="1"/>
                        <circle cx="50" cy="46" r="6" fill="#ffffff" opacity="0.8"/>
                        <rect x="25" y="76" width="50" height="12" rx="2" fill="#0a0908"/>
                        <text x="50" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="#fca5a5" text-anchor="middle">SIRENE 6V</text>
                    `;
                } else if (card.id.includes('bomba')) {
                    const pumpColor = card.isBurned ? '#475569' : '#0284c7';
                    bodyVisual = getTubes('STRAIGHT') + `
                        <circle cx="50" cy="50" r="20" fill="#0369a1" stroke="#0a0908" stroke-width="2"/>
                        <circle cx="50" cy="50" r="16" fill="${pumpColor}"/>
                        <circle cx="50" cy="50" r="6" fill="#f59e0b" stroke="#0a0908" stroke-width="1"/>
                        <rect x="25" y="76" width="50" height="12" rx="2" fill="#0a0908"/>
                        <text x="50" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="#bae6fd" text-anchor="middle">BOMBA 6V</text>
                    `;
                } else if (card.id.includes('tomografo')) {
                    const tomoColor = card.isBurned ? '#ef4444' : '#ffffff';
                    bodyVisual = getTubes('STRAIGHT') + `
                        <circle cx="50" cy="50" r="24" fill="#0a0908"/>
                        <circle cx="50" cy="50" r="20" fill="${tomoColor}" stroke="#dc2626" stroke-width="2"/>
                        <circle cx="50" cy="50" r="12" fill="#0a0908"/>
                        <rect x="25" y="76" width="50" height="12" rx="2" fill="#0a0908"/>
                        <text x="50" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="${tomoColor}" text-anchor="middle">TOMO 12V</text>
                    `;
                }
            } else if (card.type === 'gnd') {
                bodyVisual = getTubes('DEAD_END') + `
                    <rect x="48" y="25" width="40" height="42" rx="6" fill="#0a0908"/>
                    <rect x="52" y="28" width="32" height="36" rx="4" fill="#0d9488" stroke="#14b8a6" stroke-width="2"/>
                    <line x1="52" y1="50" x2="68" y2="50" stroke="#0a0908" stroke-width="3"/>
                    <line x1="68" y1="38" x2="68" y2="62" stroke="#0a0908" stroke-width="3"/>
                    <line x1="75" y1="42" x2="75" y2="58" stroke="#0a0908" stroke-width="2"/>
                    <rect x="48" y="76" width="40" height="12" rx="2" fill="#0a0908"/>
                    <text x="68" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="#2dd4bf" text-anchor="middle">GND 0V</text>
                `;
            } else if (card.type === 'fuse') {
                const fuseStatusColor = card.isBurned ? '#ef4444' : '#fbbf24';
                bodyVisual = getTubes('STRAIGHT') + `
                    <rect x="20" y="36" width="60" height="28" rx="8" fill="#0a0908"/>
                    <rect x="24" y="40" width="52" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
                    <path d="M 35 50 Q 50 38 50 50 T 65 50" fill="none" stroke="${fuseStatusColor}" stroke-width="2"/>
                    <rect x="25" y="76" width="50" height="12" rx="2" fill="#0a0908"/>
                    <text x="50" y="84" font-family="'Rubik', sans-serif" font-size="7" font-weight="900" fill="#38bdf8" text-anchor="middle">${card.isBurned ? 'ROMPIDO' : 'FUSÍVEL 1A'}</text>
                `;
            } else if (card.type === 'wire') {
                bodyVisual = getTubes(card.shape);
            }

            return `
            <svg width="${w}" height="${h}" viewBox="0 0 100 100" style="display:block; border-radius:6px; overflow:hidden; border:1px solid #1e1b18;">
                ${baseVisual}
                ${bodyVisual}
            </svg>
            `;
        }

        // Montar a página
        const deck = generateFullDeck();
        const container = document.getElementById('pages-container');

        for (let i = 0; i < deck.length; i += 12) {
            const pageCards = deck.slice(i, i + 12);
            let pageHtml = `<div class="a4-page">
                <div class="page-header-tag">
                    <span>VOLTZ: CIRCUIT BREAK // EDIÇÃO PNP (VIRTUAL AESTHETIC)</span>
                    <span>PÁGINA ${Math.floor(i/12) + 1} / 6</span>
                </div>`;
            
            pageCards.forEach(card => {
                pageHtml += `<div class="card-container">${renderCardSVG(card)}</div>`;
            });
            
            pageHtml += `</div>`;
            container.innerHTML += pageHtml;
        }
    </script>

</body>
</html>
