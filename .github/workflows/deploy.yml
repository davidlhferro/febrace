name: Deploy VOLTZ to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p dist
          # A raiz do site público será a Bancada de Testes rápida
          cp -r 01_Jogo_Voltz/bancada_playtest/* dist/
          # O Portal Completo fica acessível em /portal/
          mkdir -p dist/portal
          cp -r 01_Jogo_Voltz/portal_equipe/* dist/portal/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
